spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:hydro_company;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE
spring.datasource.user=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.show-sql=false


file.upload-user-dir=uploads/user_dir/
file.upload-product-scheme-dir=uploads/product/scheme/
file.upload-product-images-dir=uploads/product/images/

file.upload-test-dir=uploads/test/test/test/
file.multipart.max-size-file=3145728
file.multipart.max-length-file=254
file.multipart.max-allowed-files=5
file.limit-pictures=10

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB